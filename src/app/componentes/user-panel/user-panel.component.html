<div class="user-panel-wrapper">
  <div class="user-panel-wrapper__right user-panel">
    <div class="user-panel-avatar-container">
      <div class="user-panel-username">{{ (userData$ | async)?.username }}</div>
      <button type="button" class="user-panel-avatar" (click)="userMenuToggle()"
              aria-label="Open user menu" [attr.aria-expanded]="showPanel()">
        <app-avatar
             [iconType]="'icon'"
             [icon]="'pi pi-user'"
             [size]="'large'"
             [class]="'text'"
        ></app-avatar>
      </button>
    </div>
  </div>

  @if (showPanel()) {
    <div class="overlay overlay-user overlay-fall">
      <ul>
        @for (item of userItems; track $index) {
          <li>
            <button type="button" (click)="executeUserEvent(item.userEvent)">
              <i class="icon" [ngClass]="item.icon"></i>
              <span translate>{{ 'USER_PANEL.' + item.label }}</span>
            </button>
          </li>
        }
      </ul>
      <div class="language">
        <button type="button" (click)="translate.use('sp')" aria-label="Cambiar idioma a español">
          <span>{{ 'Spain' }}</span>
        </button>
        |
        <button type="button" (click)="translate.use('en')" aria-label="Switch language to English">
          <span>{{ 'English' }}</span>
        </button>
      </div>
    </div>
  }
</div>
