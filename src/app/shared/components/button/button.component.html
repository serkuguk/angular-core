<div class="default-button">
  <p-button
       [class]="class"
       [type]="type()"
       [label]="label()"
       [style]="style()"
       [disabled]="disabled()"
       [icon]="icon() ? icon() : null"
       [iconPos]="iconPos()"
       [styleClass]="styleClass() ? styleClass() : null"
  >
  </p-button>
</div>
