<p-floatlabel>
  <p-password
       type="text"
       class="password-input"
       [disabled]="isDisabled"
       (keyup)="onKeyup($event.target.value)"
       (blur)="onBlur()"
       [inputId]="labelType()"
       [(ngModel)]="value"
       [feedback]="feedback()"
       [toggleMask]="toggleMask()"
  />
  <label for="labelType()">{{ placeholder() }}</label>
</p-floatlabel>
