<div class="basic-input">
  <p-floatlabel>
    <p-password
      type="text"
      class="app-input"
      [disabled]="isDisabled"
      (keyup)="onKeyup($event.target.value)"
      (blur)="onBlur()"
      [inputId]="labelType()"
      [(ngModel)]="value"
      [toggleMask]="toggleMask()"
    />
    <label for="labelType()">{{placeholder()}}</label>
  </p-floatlabel>
</div>
