<section class="buttons-demo">
  <header class="buttons-demo__header">
    <h2>Buttons</h2>
    <p>Primary actions and toggle controls styled for the current product UI.</p>
  </header>

<h3>Checkbox Example</h3>
<div class="table-container">
  <div class="table-container__item">
    <app-checkbox
      [(value)]="esMenorEdad"
      [label]="'Tienes menor edad?'"
      (changed)="onCheckboxChanged($event)"
    />
    <p>Valor actual: {{ esMenorEdad ? 'Sí' : 'No' }}</p>
  </div>
</div>
</section>
