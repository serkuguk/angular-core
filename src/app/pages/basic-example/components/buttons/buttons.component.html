<h2>Buttons</h2>
<div class="table-container">
  <div class="table-container__item">
    <div class="table-container__item">
      <app-button
        [label]="'Custom Button'"
      ></app-button>
    </div>
  </div>
</div>

<h3>Checkbox Example</h3>
<div class="table-container">
  <div class="table-container__item">
    <app-checkbox
      [formField]="checkboxForm.esMenorEdad"
      [label]="'Tienes menor edad?'"
      (changed)="onCheckboxChanged($event)"
    />
    <p>Valor actual: {{ formModel().esMenorEdad ? 'Sí' : 'No' }}</p>
  </div>
</div>
