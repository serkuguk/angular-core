<h2>Dropdowns</h2>

<div class="dropdowns-container">
  <div class="dropdowns-container__item">
    <h3>Basic dropdown</h3>
      <app-form-field
        label="Type"
        [required]="true"
        [field]="dropdownForm.createdAt"
        [showLabel]="false"
        [isInline]="isInline()">
          <app-basic-select
              [items]="optionList()"
              [formField]="dropdownForm.createdAt"
          >
         </app-basic-select>
      </app-form-field>
  </div>
</div>
