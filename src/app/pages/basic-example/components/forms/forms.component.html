<h2>Forms</h2>

<div class="forms-container">
  <h1>{{'FORMS.FORM_TYPE.DYNAMIC' | translate}}</h1>

  <div class="delivery-form">
    <h3>{{'FORMS.HEADER_TITLE' | translate}}</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit($event)">
          <app-form-field label="Type"
                          [required]="true"
                          [field]="form.controls.type"
                          [showLabel]="false"
                          [isInline]="isInline">
                    <app-basic-select formControlName="type"
                      [items]="type()"
                    ></app-basic-select>
          </app-form-field>

          <app-form-field label="Name"
                          [required]="true"
                          [field]="form.controls.name"
                          [showLabel]="false"
                          [isInline]="isInline">
            <app-basic-input formControlName="name"
                       [placeholder]="'PAGES.LOGIN.USER' | translate"></app-basic-input>
          </app-form-field>

          @if (form.controls.type.value === 'LEGAL') {
            <app-form-field label="Inn"
                            [required]="true"
                            [field]="form.controls.inn"
                            [showLabel]="false"
                            [isInline]="isInline">
              <app-basic-input formControlName="inn"
                         [placeholder]="'Enter INN' | translate"></app-basic-input>
            </app-form-field>
          } @else {
            <app-form-field label="Last Name"
                            [required]="true"
                            [field]="form.controls.lastName"
                            [showLabel]="false"
                            [isInline]="isInline">
              <app-basic-input formControlName="lastName"
                         [placeholder]="'Enter Last Name' | translate"></app-basic-input>
            </app-form-field>
          }

          <div class="delivery-title">
            <h4 class="h6 mb16">Delivery period</h4>
          </div>

          <div>
            <div class="delivery-title">
              <h4 class="h6 mb16">Delivery address</h4>
              <app-button
                [label]="'Delivery address'"
                (click)="addAddress()"></app-button>
            </div>
