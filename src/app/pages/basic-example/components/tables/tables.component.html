<h2>Tables</h2>
<div class="table-container">
  <div class="table-container__item">
    <div class="table-container__item">
      <h3>Editable Table</h3>
      <app-table
           [dataSource]="mockData"
           [dataSourceColumns]="primeNgTableColumns"
           [paginator]="true"
           [iconColor]="'orangered'"
           [iconClass]="'fa fa-exclamation-triangle'"
           (rowUpdate)="updateSelectedRow($event)"
      ></app-table>
    </div>
  </div>
</div>
