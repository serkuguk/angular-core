<div class="header-wrapper" [ngClass]="getHeadClass()">
  <div class="header-container">
    @if (isMobile() && (isAuthenticated$ | async)) {
      <button class="hamburger-btn" (click)="onHamburgerClick.emit()" aria-label="Open navigation menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    }
    <div class="header-container__logo">
      <img src="..\assets\img\logo\nttD.png" alt="">
      <span>NTTDATA</span>
    </div>
    @if (isAuthenticated$ | async) {
      <app-user-panel></app-user-panel>
    } @else {
      <div class="language">
        <button type="button" (click)="translate.use('sp')" aria-label="Cambiar idioma a español">
          <span>{{ 'Spain' }}</span>
        </button>
        |
        <button type="button" (click)="translate.use('en')" aria-label="Switch language to English">
          <span>{{ 'English' }}</span>
        </button>
      </div>
    }
  </div>
</div>
